[workspace]
resolver = "3"
members = [
    "examples/hello",
    "examples/permission-gate",
    "examples/protected-paths",
    "examples/repo-status",
    "examples/subagent",
    "examples/todo",
    "yapi-extension-api",
    "yapi-js",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
missing_docs = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
