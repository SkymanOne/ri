[package]
name = "ri-js"
description = "The JS runtime component: QuickJS-NG with Node shims and pi's extension API."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["futures", "loader", "macro", "std"] }
wit-bindgen = "0.62"
base64 = "0.22"
serde_json = "1"
unicode-segmentation = "1"
