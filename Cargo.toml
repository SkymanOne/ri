[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SkymanOne/ri"
publish = false

[workspace.dependencies]
ri-agent = { path = "crates/ri-agent" }
ri-ai = { path = "crates/ri-ai" }
ri-core = { path = "crates/ri-core" }
ri-ext = { path = "crates/ri-ext" }
ri-mock = { path = "crates/ri-mock" }
ri-tui = { path = "crates/ri-tui" }
ri-types = { path = "crates/ri-types" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.4"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = { version = "2", features = ["serde"] }
regex-lite = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "system-proxy"] }
ratatui = { version = "0.30", default-features = false }
rustix = { version = "1", features = ["process"] }
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
similar = "2"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"

# Enforces the code rules in AGENTS.md. CI denies all warnings.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

# Binary size budget: see AGENTS.md.
[profile.release]
codegen-units = 1
lto = true
strip = true
