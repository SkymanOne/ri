[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SkymanOne/yapi"
publish = false

[workspace.dependencies]
yapi-agent = { path = "crates/yapi-agent" }
yapi-ai = { path = "crates/yapi-ai" }
yapi-core = { path = "crates/yapi-core" }
yapi-ext = { path = "crates/yapi-ext" }
yapi-mock = { path = "crates/yapi-mock" }
yapi-tui = { path = "crates/yapi-tui" }
yapi-types = { path = "crates/yapi-types" }

anyhow = "1"
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
flate2 = "1"
getrandom = "0.4"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = { version = "2", features = ["serde"] }
regex-lite = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }
portable-pty = "0.9"
oxc = { version = "=0.152.0", default-features = false, features = ["codegen", "semantic", "transformer"] }
oxc_resolver = { version = "=11.24.3", default-features = false }
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui-core = { version = "0.1", features = ["std"] }
rustix = { version = "1", features = ["process"] }
ryu-js = "1"
ruzstd = "0.9"
md-5 = "0.11"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha1 = "0.11"
sha2 = "0.11"
similar = "2"
tar = { version = "0.4", default-features = false }
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
url = "2.5"
wasmtime = { version = "=49.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=49.0.2", default-features = false }
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
vt100 = "0.16"
yaml-rust2 = { version = "0.13", default-features = false }

# Enforces the code rules in AGENTS.md. CI denies all warnings.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

# Compiling the extension runtime with an unoptimized Cranelift takes ~15 s
# per fresh agent directory in debug builds; optimized, it takes ~1 s.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true

# Cranelift compiles a component only when the compile cache has no entry for
# it, once per runtime version, so its code generator is optimized for size.
[profile.release.package.cranelift-codegen]
opt-level = "s"
[profile.release.package.cranelift-assembler-x64]
opt-level = "s"
[profile.release.package.cranelift-frontend]
opt-level = "s"
[profile.release.package.regalloc2]
opt-level = "s"
[profile.release.package.wasmtime-internal-cranelift]
opt-level = "s"
