name: Release

on:
  push:
    tags: ["v*"]
  # Builds the archives and installs them as users do, without publishing,
  # when the release process or the installer changes.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CHANGELOG.md
      - install.sh
      - about.toml
      - about.hbs
      - scripts/package-release.sh
      - scripts/check-release.sh
      - scripts/release-notes.sh
      - scripts/third-party-notices.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The cargo-binstall release that the install job checks the archives with.
  BINSTALL_VERSION: v1.25.1
  # The cargo-about release that lists the crates' licenses, and the SHA-256 of
  # its x86_64-unknown-linux-musl archive.
  ABOUT_VERSION: 0.9.2
  ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        name: Match the tag to the version in Cargo.toml and CHANGELOG.md
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          scripts/release-notes.sh "$version" >/dev/null
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  # THIRD-PARTY-NOTICES, which every archive carries next to the binary.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update stable Rust and install rust-toolchain.toml
        run: rustup update --no-self-update stable && rustup toolchain install
      - name: Install cargo-about
        run: |
          name="cargo-about-$ABOUT_VERSION-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-about/releases/download/$ABOUT_VERSION/$name.tar.gz"
          echo "$ABOUT_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Write the notices
        run: scripts/third-party-notices.sh THIRD-PARTY-NOTICES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES

  build:
    needs: notices
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04, so the binaries run with glibc 2.35 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runner images can carry an older stable, which rustup does not update
      # on its own.
      - name: Update stable Rust and install rust-toolchain.toml
        run: rustup update --no-self-update stable && rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: Check the committed extension runtime
        run: cargo xtask js-runtime --check
      - name: Build
        run: cargo build --release --locked -p yapi --target ${{ matrix.target }}
      - name: Report the newest glibc the binary needs
        if: runner.os == 'Linux'
        run: objdump -T target/${{ matrix.target }}/release/yapi | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -n 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: third-party-notices
          path: notices
      - name: Package
        run: scripts/package-release.sh target/${{ matrix.target }}/release/yapi ${{ matrix.target }} dist notices/THIRD-PARTY-NOTICES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yapi-${{ matrix.target }}
          path: dist/yapi-*

  # Installs each runner's archive with install.sh and cargo-binstall. There
  # is no Intel macOS runner, so the x86_64-apple-darwin archive runs under
  # Rosetta on the arm64 one, when the image has Rosetta.
  install:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binstall: cargo-binstall-x86_64-unknown-linux-musl.tgz
          - os: ubuntu-22.04-arm
            binstall: cargo-binstall-aarch64-unknown-linux-musl.tgz
          - os: macos-latest
            binstall: cargo-binstall-aarch64-apple-darwin.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: yapi-*
          merge-multiple: true
      - name: Install cargo-binstall
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSL -o "${{ matrix.binstall }}" "https://github.com/cargo-bins/cargo-binstall/releases/download/$BINSTALL_VERSION/${{ matrix.binstall }}"
          case "${{ matrix.binstall }}" in
            *.zip) unzip -q "${{ matrix.binstall }}" ;;
            *) tar -xzf "${{ matrix.binstall }}" ;;
          esac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install the release as users do
        run: scripts/check-release.sh dist "${{ needs.version.outputs.tag }}"
      - name: Run the x86_64 macOS archive under Rosetta
        if: runner.os == 'macOS'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "skipped: Rosetta is not installed"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/x86_64"
          tar -xzf dist/yapi-x86_64-apple-darwin.tar.gz -C "$RUNNER_TEMP/x86_64" yapi
          found=$(arch -x86_64 "$RUNNER_TEMP/x86_64/yapi" --version)
          if [ "$found" != "${TAG#v}" ]; then
            echo "::error::yapi --version printed '$found', not '${TAG#v}'"
            exit 1
          fi
          echo "ok: the x86_64-apple-darwin build runs under Rosetta"

  publish:
    if: github.ref_type == 'tag'
    needs: [build, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: yapi-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" dist/yapi-*.tar.gz*
