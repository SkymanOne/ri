name: Bench

# Measures yapi on both tier-1 platforms, next to pi on the same runner. Runs
# on demand: by hand, or for a pushed commit whose message contains [bench].
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bench]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runner images can carry an older stable, which rustup does not update
      # on its own.
      - name: Update stable Rust and install rust-toolchain.toml
        run: rustup update --no-self-update stable && rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install Pi for comparison
        # Pi's documented install: its published package, without lifecycle
        # scripts. The prefix holds nothing else, so its size is Pi's.
        run: npm install --prefix pi-install --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.0.0
      - name: Build
        run: cargo build --release --locked -p yapi
      - name: Linked libraries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L target/release/yapi
          else
            ldd target/release/yapi
          fi
      - name: Measure
        run: cargo xtask bench --pi pi-install/node_modules/.bin/pi --pi-install pi-install | tee bench.txt
      - name: Summary
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo
            cat bench.txt
          } >> "$GITHUB_STEP_SUMMARY"
