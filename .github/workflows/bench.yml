name: Bench

# The performance budgets of AGENTS.md on both tier-1 platforms, next to pi on
# the same runner. Runs on demand: by hand, or for a pushed commit whose
# message contains [bench].
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bench]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install pi for comparison
        working-directory: tests/fixtures/pi/generator
        run: npm ci
      - name: Build
        run: cargo build --release --locked -p ri
      - name: Linked libraries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L target/release/ri
          else
            ldd target/release/ri
          fi
      - name: Probe launch cost
        shell: bash
        run: |
          mkdir -p probe && cd probe
          printf 'fn main() { println!("0.1.0"); }\n' > hello.rs
          rustc -O -C strip=symbols hello.rs -o hello
          if [ "$RUNNER_OS" = "macOS" ]; then
            cat > frameworks.rs <<'RS'
          #[link(name = "CoreFoundation", kind = "framework")]
          #[link(name = "Security", kind = "framework")]
          unsafe extern "C" {
              fn SecRandomCopyBytes(rnd: *const std::ffi::c_void, count: usize, bytes: *mut u8) -> i32;
          }
          fn main() {
              if std::env::args().count() > 5 {
                  unsafe { SecRandomCopyBytes(std::ptr::null(), 0, std::ptr::null_mut()) };
              }
              println!("0.1.0");
          }
          RS
            rustc -O -C strip=symbols frameworks.rs -o frameworks
            otool -L frameworks
          fi
          python3 - <<'PY'
          import os, statistics, subprocess, time
          programs = [("true", ["true"]), ("rust hello", ["./hello"])]
          if os.path.exists("frameworks"):
              programs.append(("rust + Security, CoreFoundation", ["./frameworks"]))
          programs.append(("ri --version", ["../target/release/ri", "--version"]))
          for name, argv in programs:
              samples = []
              for _ in range(60):
                  start = time.perf_counter()
                  subprocess.run(argv, stdout=subprocess.DEVNULL, check=True)
                  samples.append((time.perf_counter() - start) * 1000)
              print(f"{name:34} median {statistics.median(samples[10:]):.2f} ms")
          PY
      - name: Measure
        run: cargo xtask bench --pi tests/fixtures/pi/generator/node_modules/.bin/pi --runs 20 | tee bench.txt
      - name: Stripped binary size
        shell: bash
        run: |
          cp target/release/ri ri-stripped
          strip ri-stripped
          bytes=$(wc -c < ri-stripped | tr -d ' ')
          echo "stripped binary: $bytes bytes" | tee -a bench.txt
      - name: Summary
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
