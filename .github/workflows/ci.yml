name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Runs on main
# never cancel each other, so every merged commit gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the change can affect the Rust build or tests. Changes only to
  # docs, internal notes, skills and other workflows skip the jobs below,
  # which then report as skipped. Any other file, or no base to compare with,
  # runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          rust=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # CHANGELOG.md is embedded in the binary, so it counts as Rust.
            if ! git diff --name-only "$BASE" HEAD \
              | grep -vxE '(docs|dev|skills|assets)/.*|book\.toml|LICENSE-.*|\.gitignore|\.github/workflows/(docs|bench|release)\.yml|(README|AGENTS|CONTRIBUTING|SECURITY)\.md' \
              | grep -q .; then
              rust=false
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runner images can carry an older stable, which rustup does not update
      # on its own.
      - name: Update stable Rust and install rust-toolchain.toml
        run: rustup update --no-self-update stable && rustup toolchain install
      - run: cargo fmt --all --check

  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runner images can carry an older stable, which rustup does not update
      # on its own.
      - name: Update stable Rust and install rust-toolchain.toml
        run: rustup update --no-self-update stable && rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install rg and fd for the grep and find tool scenarios
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep fd
          else
            sudo apt-get update && sudo apt-get install -y ripgrep fd-find
          fi
      - run: cargo xtask js-runtime --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # Hosted runners can pause longer than a desktop; terminal scenarios
          # wait this long for the screen to settle after each key.
          YAPI_SETTLE_MS: "1200"

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
