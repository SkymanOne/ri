[package]
name = "yapi"
description = "Coding agent CLI compatible with pi packages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `cargo binstall --git https://github.com/SkymanOne/ri yapi` installs the
# release archive for the host, named as scripts/package-release.sh names it.
# Its other strategies are off because both fetch `yapi` from crates.io, where
# the name belongs to another project: cargo-quickinstall's builds, and the
# fallback that compiles from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util = { workspace = true, features = ["std"] }
indexmap.workspace = true
regex-lite.workspace = true
ratatui-core.workspace = true
yapi-ai.workspace = true
yapi-core.workspace = true
yapi-ext.workspace = true
yapi-tui.workspace = true
yapi-types.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "io-std", "io-util", "sync"] }
tokio-util.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
yapi-mock.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
