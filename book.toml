# The documentation site, published to GitHub Pages by .github/workflows/docs.yml.
[book]
title = "yapi"
description = "Yet Another Pi: a minimal, extensible agent harness for the terminal, written in Rust."
authors = ["The yapi contributors"]
language = "en"
src = "docs"

[build]
build-dir = "target/book"
create-missing = false

[output.html]
site-url = "/ri/"
git-repository-url = "https://github.com/SkymanOne/ri"
edit-url-template = "https://github.com/SkymanOne/ri/edit/main/{path}"
no-section-label = true
